[project]
name = "tracker2026"
version = "0.1.0"
description = "Desktop GUI for detecting and tracking particles in .twv videos with trackpy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaka Godec" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numba>=0.60",
    "numpy>=1.26",
    "pandas>=2.1",
    "pims>=0.7",
    "pyqt6>=6.6",
    "trackpy>=0.7",
]

[dependency-groups]
# Only needed to produce the standalone .app / .exe (see README).
build = ["pyinstaller>=6.10"]

[tool.uv]
# The app is run from source (`uv run python run_app.py`), not installed as a
# wheel, so there is no build backend.
package = false
